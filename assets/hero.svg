    <circle cx="2144.3" cy="374.1" r="11" fill="#14f195" fill-opacity="0.30"/>
    <circle cx="2144.3" cy="374.1" r="6.1" fill="#ffffff" fill-opacity="0.92"/>
    <circle cx="1750.3" cy="393.2" r="22" fill="none"
            stroke="#9945ff" stroke-opacity="0.43" stroke-width="3"/>
    <circle cx="1750.3" cy="393.2" r="9" fill="#9945ff" fill-opacity="0.30"/>
    <circle cx="1750.3" cy="393.2" r="5.0" fill="#ffffff" fill-opacity="0.92"/>
    
    <g stroke="#ffffff" stroke-opacity="0.59" stroke-width="3">
