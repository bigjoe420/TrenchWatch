    <circle cx="1960" cy="540" r="400.0" fill="none" stroke="#ffffff" stroke-opacity="0.47" stroke-width="2.5"/>
    <line x1="1960.0" y1="120.0" x2="1960.0" y2="64.0" stroke="#ffffff" stroke-opacity="0.43" stroke-width="2.5"/>
    <line x1="2170.0" y1="176.3" x2="2186.0" y2="148.6" stroke="#ffffff" stroke-opacity="0.27" stroke-width="2.5"/>
    <line x1="2323.7" y1="330.0" x2="2351.4" y2="314.0" stroke="#ffffff" stroke-opacity="0.27" stroke-width="2.5"/>
    <line x1="2380.0" y1="540.0" x2="2436.0" y2="540.0" stroke="#ffffff" stroke-opacity="0.43" stroke-width="2.5"/>
    <line x1="2323.7" y1="750.0" x2="2351.4" y2="766.0" stroke="#ffffff" stroke-opacity="0.27" stroke-width="2.5"/>
    <line x1="2170.0" y1="903.7" x2="2186.0" y2="931.4" stroke="#ffffff" stroke-opacity="0.27" stroke-width="2.5"/>
    <line x1="1960.0" y1="960.0" x2="1960.0" y2="1016.0" stroke="#ffffff" stroke-opacity="0.43" stroke-width="2.5"/>
