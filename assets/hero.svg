    <circle cx="2131.2" cy="484.4" r="7" fill="#ffcd6e" fill-opacity="0.55"/><circle cx="2195.9" cy="463.4" r="6" fill="#ffcd6e" fill-opacity="0.4"/><circle cx="2256.7" cy="443.6" r="5" fill="#ffcd6e" fill-opacity="0.28"/>
    <line x1="1960" y1="540" x2="2340.4" y2="416.4" stroke="#ffcd6e"
