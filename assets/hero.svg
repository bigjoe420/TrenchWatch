  <g font-family="Cascadia Mono, Consolas, monospace">
    <text x="170" y="500" font-size="148" font-weight="bold"
          letter-spacing="18" fill="#f7f7f8">TRENCH</text>
    <text x="170" y="500" font-size="148" font-weight="bold"
