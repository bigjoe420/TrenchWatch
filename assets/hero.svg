    <line x1="1596.3" y1="330.0" x2="1568.6" y2="314.0" stroke="#ffffff" stroke-opacity="0.27" stroke-width="2.5"/>
    <line x1="1750.0" y1="176.3" x2="1734.0" y2="148.6" stroke="#ffffff" stroke-opacity="0.27" stroke-width="2.5"/>
    
    <path d="M 1960 540 L 1918.2 142.2 A 400 400 0 0 1 2340.4 416.4 Z"
