<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TrenchWatch radar emblem">
  <!--
    TrenchWatch emblem — source of the raster assets in this directory.
    Regenerate the PNGs after editing with: python assets/generate_logo.py
    (generate_logo.py is the source of truth for wordmark lockups; this
    file covers the emblem only.)
    Palette matches src/styles/global.css:
      helius orange #ffa100, solana purple #9945ff, solana green #14f195.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15151c"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffa100" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffa100" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffa100" stop-opacity="0.62"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="10" y="10" width="492" height="492" rx="118" fill="url(#tile)"/>
  <rect x="10" y="10" width="492" height="492" rx="118" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- rings: center (256, 266), outer radius 184 -->
  <g fill="none" stroke="#ffffff">
    <circle cx="256" cy="266" r="46"  stroke-opacity="0.24" stroke-width="2"/>
    <circle cx="256" cy="266" r="92"  stroke-opacity="0.24" stroke-width="2"/>
    <circle cx="256" cy="266" r="138" stroke-opacity="0.27" stroke-width="2"/>
    <circle cx="256" cy="266" r="184" stroke-opacity="0.47" stroke-width="2"/>
  </g>

  <!-- ticks -->
  <g stroke="#ffffff" stroke-width="2">
    <line x1="256" y1="66"  x2="256" y2="46"  stroke-opacity="0.43"/>
    <line x1="256" y1="466" x2="256" y2="446" stroke-opacity="0.27"/>
    <line x1="56"  y1="266" x2="76"  y2="266" stroke-opacity="0.43"/>
    <line x1="456" y1="266" x2="436" y2="266" stroke-opacity="0.27"/>
    <line x1="116" y1="126" x2="130" y2="140" stroke-opacity="0.27"/>
    <line x1="396" y1="126" x2="382" y2="140" stroke-opacity="0.27"/>
    <line x1="116" y1="406" x2="130" y2="392" stroke-opacity="0.27"/>
    <line x1="396" y1="406" x2="382" y2="392" stroke-opacity="0.27"/>
    <line x1="76"  y1="182" x2="88"  y2="187" stroke-opacity="0.27"/>
    <line x1="436" y1="182" x2="424" y2="187" stroke-opacity="0.27"/>
    <line x1="76"  y1="350" x2="88"  y2="345" stroke-opacity="0.27"/>
    <line x1="436" y1="350" x2="424" y2="345" stroke-opacity="0.27"/>
  </g>

  <!-- sweep: 70-degree wedge from top -->
  <path d="M 256 266 L 256 82 A 184 184 0 0 1 428.9 203.1 Z" fill="url(#sweep)"/>

  <!-- leading edge + ping -->
  <line x1="256" y1="266" x2="428.9" y2="203.1" stroke="#ffcd6e" stroke-opacity="0.92" stroke-width="3" stroke-linecap="round"/>
  <circle cx="428.9" cy="203.1" r="10" fill="#ffdc96" fill-opacity="0.45"/>
  <circle cx="428.9" cy="203.1" r="5"  fill="#fff0d2"/>

  <!-- blips: detected launches -->
  <circle cx="332" cy="172" r="14" fill="none" stroke="#14f195" stroke-opacity="0.43" stroke-width="2"/>
  <circle cx="332" cy="172" r="10" fill="#14f195" fill-opacity="0.30"/>
  <circle cx="332" cy="172" r="6"  fill="#ffffff" fill-opacity="0.92"/>
  <circle cx="216" cy="386" r="12" fill="none" stroke="#9945ff" stroke-opacity="0.43" stroke-width="2"/>
  <circle cx="216" cy="386" r="8"  fill="#9945ff" fill-opacity="0.30"/>
  <circle cx="216" cy="386" r="4.5" fill="#ffffff" fill-opacity="0.90"/>

  <!-- center crosshair -->
  <g stroke="#ffffff" stroke-opacity="0.59" stroke-width="2">
    <line x1="241" y1="266" x2="271" y2="266"/>
    <line x1="256" y1="251" x2="256" y2="281"/>
  </g>
  <circle cx="256" cy="266" r="5" fill="#ffffff" fill-opacity="0.86"/>
</svg>
