[package]
name = "trenchwatch"
version = "0.1.0"
description = "Real-time Solana launch monitor with explainable rug-pull risk scoring"
authors = ["TrenchWatch contributors"]
license = "MIT"
repository = "https://github.com/bigjoe420/TrenchWatch"
edition = "2021"

[lib]
name = "trenchwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# tokio-tungstenite disables rustls default features and does not select a
# crypto provider — pick one explicitly or every TLS connect panics.
rustls = { version = "0.23", features = ["ring"] }
async-trait = "0.1"
futures-util = "0.3"
# Read-only JSON-RPC over HTTP. Generic methods (getTransaction etc.) are not
# served by standard Solana websocket endpoints — only pubsub is — so the
# read path must be HTTP even though streaming stays on the websocket.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
crc32fast = "1"
base64 = "0.22"

# Non-goals (see docs/THREAT_MODEL.md): this crate must never depend on
# keypair, signing, or transaction-building crates. Anything that could
# move funds is out of the dependency tree by design.

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
