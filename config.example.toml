# TrenchWatch configuration.
# Copy this file to `config.toml` and adjust. `config.toml` is gitignored
# and must never contain real secrets you are not comfortable storing locally.

[rpc]
# WebSocket endpoint for Solana mainnet-beta. The free public endpoint works
# for development; a dedicated provider (e.g. Helius) improves reliability.
# Later phases swap this without code changes — see docs/ARCHITECTURE.md.
ws_url = "wss://api.mainnet-beta.solana.com"
# Optional provider API key. Empty = use the public endpoint for everything.
# When set, the app uses it for targeted read-only enrichment calls only
# (parsed transactions, asset/metadata lookups) with metering and a daily
# cap — the launch stream itself stays on the free websocket.
api_key = ""
# Daily credit budget for enrichment calls (0 = unlimited — not recommended).
daily_credit_cap = 100000

[monitor]
# Minimum pool liquidity (in USD) before a launch is surfaced in the UI
# and eligible for alerts. 0 = surface everything.
min_liquidity_usd = 0

[alerts]
# Desktop notifications for flagged launches at or above min_severity.
desktop_notifications = true
# Lowest severity that triggers an alert: "critical" (default), "warn", or "info".
min_severity = "critical"
# Optional Discord webhook for receipts-style launch alerts.
# Leave empty to disable. The app only POSTs to this exact URL.
discord_webhook_url = ""
# Optional separate webhook for flag (risk) alerts, e.g. a #critical-flags
# channel. Empty = flag alerts fall back to discord_webhook_url. Graduation
# alerts always go to discord_webhook_url.
discord_critical_webhook_url = ""
# Announce when a tracked token graduates from its launchpad to a real DEX
# pool (e.g. Pump.fun -> PumpSwap). These fire even when no risk flag did —
# a graduation is a lifecycle event, not a verdict.
graduation_alerts = true
# Set by the app after the first-run setup wizard finishes. False (or absent)
# = show the wizard before the dashboard on next launch.
setup_completed = false

[storage]
# Directory for the local event store (relative to the app data dir).
# Overridable mostly for tests; leave default in normal use.
store_dir = "store"
